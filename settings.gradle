pluginManagement {
    repositories {
        mavenCentral()
        google()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
        google()
    }

    versionCatalogs {
        serverLibs {
            from(files('embedded/server/server.versions.toml'))
        }
    }
}

rootProject.name = "YouLongTool"
include ':app'
include ':shizuku-aidl'
include ':shizuku-api'

project(':shizuku-aidl').projectDir = file('embedded/shizuku-aidl')
project(':shizuku-api').projectDir = file('embedded/shizuku-api')
